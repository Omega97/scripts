<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NodeNet — 3D Network</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0d0d14; }
    #graph { position: fixed; inset: 0; }
    #tooltip {
      position: fixed; display: none; pointer-events: none;
      background: rgba(20, 22, 35, 0.92); color: #eaeaf2;
      padding: 8px 12px; border-radius: 8px; font-family: sans-serif;
      font-size: 13px; line-height: 1.4; max-width: 320px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); z-index: 10;
    }
    #tooltip .tt-name { font-weight: 700; font-size: 15px; }
    #tooltip .tt-meta { color: #9aa0b5; font-size: 12px; }
    #legend {
      position: fixed; left: 16px; bottom: 16px; z-index: 10;
      background: rgba(20, 22, 35, 0.85); color: #eaeaf2;
      padding: 10px 14px; border-radius: 8px; font-family: sans-serif;
      font-size: 12px;
    }
    #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    #legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    #hint {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      color: #9aa0b5; font-family: sans-serif; font-size: 12px; z-index: 10;
      background: rgba(20, 22, 35, 0.6); padding: 6px 12px; border-radius: 999px;
    }
  </style>
  <script src="https://unpkg.com/three@0.156.1/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
</head>
<body>
  <div id="graph"></div>
  <div id="tooltip"></div>
  <div id="hint">Drag to rotate &middot; scroll to zoom &middot; right-drag to pan &middot; hover a node to highlight</div>
  <div id="legend"></div>

  <script>
    var data = __GRAPH_DATA__;

    var tooltip = document.getElementById('tooltip');
    var statusColors = __STATUS_COLORS__;

    function buildLegend() {
      var legend = document.getElementById('legend');
      legend.innerHTML = '<div class="row"><span style="color:#9aa0b5">Status:</span></div>';
      Object.keys(statusColors).forEach(function (s) {
        var row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = '<span class="dot" style="background:' + statusColors[s] + '"></span>' + s;
        legend.appendChild(row);
      });
    }
    buildLegend();

    if (typeof ForceGraph3D === 'undefined') {
      document.getElementById('hint').textContent = 'Failed to load 3D library (no internet?). Please check your connection.';
      throw new Error('ForceGraph3D not available');
    }

    var graph = ForceGraph3D()(document.getElementById('graph'))
      .graphData(data)
      .backgroundColor('#0d0d14')
      .controlType('orbit')
      .nodeVal(function (d) { return 2 + (d.degree || 0) * 1.5; })
      .nodeColor(function (d) { return statusColors[d.status] || '#7f8c8d'; })
      .nodeLabel(function (d) { return d.name; })
      .nodeRelSize(3)
      .linkWidth(function (l) { return l.strength === 'strong' ? 2 : l.strength === 'weak' ? 0.6 : 1.2; })
      .linkOpacity(0.5)
      .linkDirectionalParticles(1)
      .linkDirectionalParticleWidth(1)
      .linkColor(function () { return 'rgba(150, 160, 190, 0.6)'; })
      .onNodeHover(handleHover)
      .onNodeClick(function (node) {
        // recenter on click
        var dist = 40;
        graph.cameraPosition(
          { x: node.x, y: node.y, z: node.z + dist },
          node,
          1000
        );
      });

    function connectedIds(node) {
      var set = {};
      data.links.forEach(function (l) {
        var s = typeof l.source === 'object' ? l.source.id : l.source;
        var t = typeof l.target === 'object' ? l.target.id : l.target;
        if (s === node.id) set[t] = true;
        if (t === node.id) set[s] = true;
      });
      return set;
    }

    function handleHover(node) {
      if (node) {
        var neighbors = connectedIds(node);
        var dim = 'rgba(120, 120, 140, 0.25)';
        graph
          .nodeColor(function (d) {
            if (d.id === node.id) return '#ffd54f';
            if (neighbors[d.id]) return statusColors[d.status] || '#7f8c8d';
            return dim;
          })
          .linkColor(function (l) {
            var s = typeof l.source === 'object' ? l.source.id : l.source;
            var t = typeof l.target === 'object' ? l.target.id : l.target;
            if (s === node.id || t === node.id) return 'rgba(255, 213, 79, 0.9)';
            return 'rgba(120, 120, 140, 0.15)';
          })
          .linkWidth(function (l) {
            var s = typeof l.source === 'object' ? l.source.id : l.source;
            var t = typeof l.target === 'object' ? l.target.id : l.target;
            if (s === node.id || t === node.id) return 2.5;
            return l.strength === 'strong' ? 2 : 1;
          });

        tooltip.innerHTML =
          '<div class="tt-name">' + node.name + '</div>' +
          '<div class="tt-meta">' + (node.status || '') + (node.description ? ' — ' + node.description : '') + '</div>';
        tooltip.style.display = 'block';
      } else {
        graph
          .nodeColor(function (d) { return statusColors[d.status] || '#7f8c8d'; })
          .linkColor(function () { return 'rgba(150, 160, 190, 0.6)'; })
          .linkWidth(function (l) { return l.strength === 'strong' ? 2 : l.strength === 'weak' ? 0.6 : 1.2; });
        tooltip.style.display = 'none';
      }
    }

    window.addEventListener('mousemove', function (e) {
      if (tooltip.style.display === 'block') {
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top = (e.clientY + 14) + 'px';
      }
    });

    window.addEventListener('resize', function () {
      graph.width(window.innerWidth).height(window.innerHeight);
    });
  </script>
</body>
</html>
